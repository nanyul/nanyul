name: Metrics

on:
  schedule:
    # cada 6 horas
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-24.04
    steps:
      # Lenguajes más usados (por bytes, con peso a la actividad reciente).
      # METRICS_TOKEN es opcional; si falta, se usa el token integrado de GitHub.
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: nanyul
          filename: assets/metrics.languages.svg
          base: ""
          config_timezone: America/Costa_Rica
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
