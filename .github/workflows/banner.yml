name: Banner

on:
  push:
    branches: [main]
    paths:
      - "assets/source/photo.png"
      - "scripts/banner/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r scripts/banner/requirements.txt
      - name: Generate banner (fixed version 11)
        run: python scripts/banner/generate.py --version 11 2>&1
      - name: Update README to v11
        run: |
          sed -i "s/banner-dark\.v10/banner-dark.v11/g" README.md
          sed -i "s/banner-light\.v10/banner-light.v11/g" README.md
      - name: Commit & push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner-*.v11.svg README.md
          git diff --staged --quiet || git commit -m "chore: regenerate banner v11 with photo"
          git push